<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#022049;--navy3:#010e24;--blue:#0661de;--blue2:#0450b4;--elec:#2979ff;--green:#16a34a;--red:#dc2626;--amber:#f59e0b;--bpale:#e8f0fe;--bxpale:#f0f4ff;--t:#1d1d1f;--t2:#3d3d3d;--tm:#6e6e73;--tl:#86868b;--bg:#fff;--bg2:#f5f5f7;--bg3:#e8ecf0;--bd:#d2d2d7;--ss:0 1px 3px rgba(0,0,0,.06);--sm:0 2px 12px rgba(0,0,0,.08);--sl:0 8px 32px rgba(0,0,0,.1);--r:12px;--rsm:8px;--rlg:18px;--rxl:24px;--f:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;--ft:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:var(--ft);background:var(--bg2);color:var(--t);line-height:1.6;min-height:100vh}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none}
.no-select{-webkit-user-select:none;user-select:none}
.lbar{background:var(--navy3);display:flex;justify-content:flex-end;gap:2px;padding:6px 5vw;align-items:center}
.lb{background:none;border:none;color:rgba(255,255,255,.4);font-size:.72rem;font-weight:500;font-family:var(--f);letter-spacing:.04em;padding:4px 10px;border-radius:20px;cursor:pointer}
.lb:hover{color:rgba(255,255,255,.75)}
.lb.on{color:#fff;background:rgba(255,255,255,.12)}
nav{position:sticky;top:0;z-index:500;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.07)}
.ni{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;height:52px}
.nlogo{display:flex;align-items:center;gap:9px;text-decoration:none}
.nlogo img{height:28px;width:28px}
.nlt{display:flex;flex-direction:column;line-height:1.15}
.nlt1{font-size:.55rem;font-weight:700;letter-spacing:.2em;color:var(--blue);text-transform:uppercase}
.nlt2{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--navy);text-transform:uppercase}
.nback{font-size:.78rem;color:var(--tm);font-weight:500}
.screen{display:none;animation:fadeIn .4s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.wrap{max-width:760px;margin:0 auto;padding:40px 5vw 80px}
.intro-hero{background:linear-gradient(160deg,var(--navy3),var(--navy));border-radius:var(--rxl);padding:48px 40px;text-align:center;color:#fff;box-shadow:var(--sl);margin-bottom:2rem;position:relative;overflow:hidden}
.intro-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(96,165,250,.18),transparent 60%)}
.intro-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.25);color:#60a5fa;font-size:.72rem;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:1.4rem;position:relative;letter-spacing:.05em;text-transform:uppercase}
.intro-hero h1{font-family:var(--f);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-bottom:.8rem;position:relative}
.intro-hero h1 em{font-style:normal;color:#60a5fa}
.intro-hero p{font-size:.98rem;color:rgba(255,255,255,.7);max-width:520px;margin:0 auto 1.8rem;line-height:1.65;position:relative}
.intro-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.1);border-radius:var(--rlg);overflow:hidden;max-width:500px;margin:0 auto;position:relative}
.intro-mi{background:rgba(20,28,55,.7);padding:16px 12px;text-align:center}
.intro-mn{font-family:var(--f);font-size:1.4rem;font-weight:700;color:#fff}
.intro-ml{font-size:.68rem;color:rgba(255,255,255,.5);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.intro-features{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:2rem}
.if-card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;display:flex;gap:12px;align-items:flex-start}
.if-icon{width:32px;height:32px;border-radius:8px;background:var(--bxpale);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.if-icon svg{width:16px;height:16px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round}
.if-card h4{font-size:.85rem;font-weight:700;color:var(--navy);margin-bottom:.2rem}
.if-card p{font-size:.78rem;color:var(--tm);line-height:1.5}
@media(max-width:640px){.intro-features{grid-template-columns:1fr}}
.warning-block{background:#fef3c7;border:1px solid #fbbf24;border-radius:var(--rlg);padding:18px 22px;margin-bottom:2rem;display:flex;gap:12px;align-items:flex-start}
.warning-block svg{width:20px;height:20px;stroke:#b45309;flex-shrink:0;margin-top:2px;fill:none;stroke-width:2}
.warning-block h4{font-size:.88rem;font-weight:700;color:#78350f;margin-bottom:.4rem}
.warning-block ul{list-style:none;font-size:.8rem;color:#78350f;line-height:1.7}
.warning-block ul li::before{content:"- ";font-weight:700}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;padding:15px 36px;border-radius:980px;font-size:1rem;font-weight:700;font-family:var(--f);text-decoration:none;border:none;cursor:pointer}
.btn-primary:hover{background:var(--blue2)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-big{padding:17px 40px;font-size:1.05rem}
.text-center{text-align:center}
.form-card{background:#fff;border:1px solid var(--bd);border-radius:var(--rxl);padding:40px;box-shadow:var(--sm)}
.form-card h2{font-family:var(--f);font-size:1.5rem;font-weight:700;color:var(--navy);margin-bottom:.4rem}
.form-card .subtitle{font-size:.88rem;color:var(--tm);margin-bottom:2rem;line-height:1.6}
.fg{margin-bottom:1.1rem}
.fg label{display:block;font-size:.82rem;font-weight:600;color:var(--navy);margin-bottom:.4rem}
.fg .req{color:var(--blue)}
.fg input,.fg select{width:100%;padding:12px 15px;border:1.5px solid var(--bd);border-radius:var(--rsm);font-size:.93rem;font-family:var(--ft);color:var(--t);background:#fff;outline:none}
.fg input:focus,.fg select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(6,97,222,.1)}
.fg input.invalid{border-color:var(--red)}
.fg .hint{font-size:.74rem;color:var(--tl);margin-top:.3rem}
.fg .err{font-size:.74rem;color:var(--red);margin-top:.3rem;display:none}
.fg.has-error .err{display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.frow{grid-template-columns:1fr}}
.optional-note{font-size:.76rem;color:var(--tl);font-weight:400}
.test-header{background:var(--navy);color:#fff;padding:14px 5vw;position:sticky;top:0;z-index:100;box-shadow:var(--ss)}
.test-header-inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.test-section-label{font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#60a5fa}
.test-progress-info{display:flex;align-items:center;gap:18px;font-size:.85rem}
.test-timer{font-family:var(--f);font-size:1.15rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.test-timer.warn{color:#fbbf24}
.test-timer.critical{color:#fca5a5;animation:pulse 1s infinite}
.test-timer svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.test-lang-switch{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:20px;padding:3px}
.test-lang-switch button{background:none;border:none;color:rgba(255,255,255,.5);font-size:.7rem;font-weight:600;font-family:var(--f);padding:4px 10px;border-radius:14px;cursor:pointer}
.test-lang-switch button.on{background:rgba(96,165,250,.2);color:#fff}
.progress-bar-outer{background:rgba(255,255,255,.15);height:4px;width:100%}
.progress-bar-inner{background:#60a5fa;height:100%;width:0%;transition:width .3s ease}
.question-wrap{max-width:760px;margin:0 auto;padding:32px 5vw 80px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;font-size:.78rem;color:var(--tm)}
.q-num{font-weight:600;color:var(--navy);font-family:var(--f)}
.q-diff{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.q-diff.d1{background:#dcfce7;color:#15803d}
.q-diff.d2{background:var(--bxpale);color:var(--blue)}
.q-diff.d3{background:#fef3c7;color:#b45309}
.q-diff.d4{background:#fee2e2;color:var(--red)}
.q-card{background:#fff;border:1px solid var(--bd);border-radius:var(--rxl);padding:36px;box-shadow:var(--sm);margin-bottom:1.5rem}
.q-passage{background:var(--bg2);border-left:3px solid var(--blue);padding:16px 20px;border-radius:0 var(--rsm) var(--rsm) 0;font-size:.92rem;color:var(--t2);line-height:1.7;margin-bottom:1.3rem;font-style:italic}
.q-text{font-size:1.12rem;font-weight:500;color:var(--t);line-height:1.55;margin-bottom:1.5rem}
.q-choices{display:flex;flex-direction:column;gap:10px}
.q-choice{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border:1.5px solid var(--bd);border-radius:var(--r);background:#fff;cursor:pointer;font-size:.95rem;color:var(--t2);text-align:left;width:100%;font-family:inherit}
.q-choice:hover{border-color:var(--blue);background:var(--bxpale)}
.q-choice.selected{border-color:var(--blue);background:var(--bpale);color:var(--navy);font-weight:600}
.q-choice-letter{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--bg2);color:var(--tm);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;font-family:var(--f)}
.q-choice.selected .q-choice-letter{background:var(--blue);color:#fff}
.q-choice-text{flex:1;line-height:1.5}
.test-actions{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1rem}
.warn-strikes{font-size:.78rem;color:var(--amber);font-weight:600}
.break-card{background:linear-gradient(160deg,var(--navy3),var(--navy));border-radius:var(--rxl);padding:48px 40px;text-align:center;color:#fff;box-shadow:var(--sl)}
.break-icon{width:80px;height:80px;border-radius:50%;background:rgba(96,165,250,.12);border:2px solid rgba(96,165,250,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem}
.break-icon svg{width:38px;height:38px;stroke:#60a5fa;fill:none;stroke-width:2}
.break-card h2{font-family:var(--f);font-size:1.8rem;font-weight:700;color:#fff;margin-bottom:.6rem}
.break-card p{font-size:.95rem;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:1.5rem}
.break-score-box{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.2);border-radius:var(--rlg);padding:24px;margin:0 auto 1.8rem;max-width:360px}
.break-score-label{font-size:.72rem;color:rgba(255,255,255,.5);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:.5rem}
.break-score-num{font-family:var(--f);font-size:3rem;font-weight:700;color:#60a5fa;line-height:1}
.break-score-out{font-size:.88rem;color:rgba(255,255,255,.55);margin-top:.3rem}
.break-countdown{font-size:.8rem;color:rgba(255,255,255,.5);margin-top:.8rem}
.btn-white{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);padding:14px 32px;border-radius:980px;font-size:.95rem;font-weight:700;text-decoration:none;border:none;cursor:pointer;font-family:var(--f)}
.btn-white:hover{background:var(--bg2)}
.full-overlay{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:2rem;text-align:center}
.full-overlay.active{display:flex}
.full-overlay.danger{background:rgba(220,38,38,.95);color:#fff}
.full-overlay.warn{background:rgba(245,158,11,.95);color:#fff}
.full-overlay h2{font-family:var(--f);font-size:2rem;font-weight:700;margin-bottom:.5rem}
.full-overlay p{font-size:1rem;max-width:440px;margin-bottom:1.5rem}
.full-overlay button{background:#fff;color:var(--red);padding:12px 28px;border-radius:980px;font-weight:700;border:none;cursor:pointer}
.full-overlay.warn button{color:#b45309}
.error-msg{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;font-size:.82rem;padding:10px 14px;border-radius:var(--rsm);margin-bottom:1rem;display:none}
@media(max-width:640px){.q-card{padding:24px 20px}.intro-hero,.break-card{padding:32px 24px}.form-card{padding:28px 22px}}
body.in-test .lbar,body.in-test nav{display:none}
body.in-test{padding:0 !important}
#screen-results{padding:0}
.results-wrap{max-width:1000px;margin:0 auto;padding:32px 5vw 80px}
.results-hero{background:linear-gradient(160deg,var(--navy3),var(--navy));border-radius:var(--rxl);padding:44px 36px;text-align:center;color:#fff;box-shadow:var(--sl);margin-bottom:1.5rem;position:relative;overflow:hidden}
.results-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(96,165,250,.2),transparent 60%)}
.level-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:30px;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:1.2rem;position:relative}
.level-foundation{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.level-building{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);color:#fcd34d}
.level-passed{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#86efac}
.level-advanced{background:linear-gradient(90deg,rgba(96,165,250,.2),rgba(124,58,237,.2));border:1px solid rgba(96,165,250,.4);color:#a5b4fc}
.level-excellent{background:linear-gradient(90deg,rgba(251,191,36,.2),rgba(245,158,11,.2));border:1px solid rgba(251,191,36,.4);color:#fcd34d}
.results-score{font-family:var(--f);font-size:clamp(3.5rem,8vw,5.5rem);font-weight:700;color:#fff;letter-spacing:-.04em;line-height:1;position:relative}
.results-score-out{font-size:1.1rem;color:rgba(255,255,255,.5);margin-top:.3rem;position:relative}
.results-percent{font-family:var(--f);font-size:1.4rem;font-weight:600;color:#60a5fa;margin-top:.5rem;position:relative}
.results-status{display:inline-flex;align-items:center;gap:8px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86efac;font-size:.85rem;font-weight:700;padding:8px 18px;border-radius:30px;margin-top:1rem;position:relative}
.results-status.fail{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5}
.results-status svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.results-sections{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:1.5rem}
.rs-card{background:#fff;border:1px solid var(--bd);border-radius:var(--rlg);padding:28px;box-shadow:var(--ss)}
.rs-card-label{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:.5rem}
.rs-card-label.eng{color:var(--green)}
.rs-card h3{font-family:var(--f);font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:.8rem}
.rs-score-row{display:flex;align-items:baseline;gap:10px;margin-bottom:.8rem}
.rs-score{font-family:var(--f);font-size:2.4rem;font-weight:700;color:var(--navy)}
.rs-total{font-size:1rem;color:var(--tl)}
.rs-pct{font-size:.85rem;color:var(--tm);font-weight:600;margin-left:auto}
.rs-bar-wrap{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:.6rem}
.rs-bar{height:100%;border-radius:4px;transition:width 1s ease}
.rs-bar.math{background:linear-gradient(90deg,var(--blue),var(--elec))}
.rs-bar.english{background:linear-gradient(90deg,var(--green),#22c55e)}
.rs-status{font-size:.8rem;color:var(--tm);line-height:1.5}
.cefr-badge{display:inline-block;background:var(--bxpale);border:1px solid rgba(6,97,222,.2);color:var(--blue);font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:.4rem}
@media(max-width:640px){.results-sections{grid-template-columns:1fr}}
.sat-estimate-card{background:linear-gradient(135deg,#fff,var(--bxpale));border:2px solid var(--blue);border-radius:var(--rlg);padding:28px;text-align:center;margin-bottom:1.5rem;box-shadow:var(--sm)}
.sat-est-label{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:.4rem}
.sat-est-score{font-family:var(--f);font-size:3rem;font-weight:700;color:var(--navy);line-height:1;margin-bottom:.3rem}
.sat-est-range{font-size:.88rem;color:var(--tm);margin-bottom:1rem}
.sat-gap-info{background:var(--bg2);border-radius:var(--r);padding:14px 18px;font-size:.84rem;color:var(--t2);line-height:1.6}
.sat-gap-info strong{color:var(--navy)}
.topic-breakdown{background:#fff;border:1px solid var(--bd);border-radius:var(--rlg);padding:28px;box-shadow:var(--ss);margin-bottom:1.5rem}
.topic-breakdown h3{font-family:var(--f);font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:1rem}
.topic-list{display:flex;flex-direction:column;gap:10px}
.topic-item{display:flex;align-items:center;gap:14px}
.topic-name{flex:0 0 180px;font-size:.82rem;color:var(--t2);font-weight:500;text-transform:capitalize}
.topic-bar-wrap{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.topic-bar{height:100%;border-radius:4px;transition:width 1s ease}
.topic-bar.strong{background:var(--green)}
.topic-bar.ok{background:var(--blue)}
.topic-bar.weak{background:var(--amber)}
.topic-bar.gap{background:var(--red)}
.topic-pct{flex:0 0 50px;text-align:right;font-size:.78rem;color:var(--tm);font-weight:600;font-family:var(--f)}
@media(max-width:640px){.topic-name{flex:0 0 120px;font-size:.76rem}}
.strengths-gaps{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:1.5rem}
.sg-card{background:#fff;border:1px solid var(--bd);border-radius:var(--rlg);padding:24px;box-shadow:var(--ss)}
.sg-card.strength{border-left:4px solid var(--green)}
.sg-card.gap{border-left:4px solid var(--amber)}
.sg-card h4{font-size:.88rem;font-weight:700;color:var(--navy);margin-bottom:.8rem}
.sg-card ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.sg-card ul li{font-size:.82rem;color:var(--t2);padding:6px 12px;background:var(--bg2);border-radius:var(--rsm);text-transform:capitalize}
@media(max-width:640px){.strengths-gaps{grid-template-columns:1fr}}
.recommend-card{background:linear-gradient(135deg,var(--navy3),var(--navy));border-radius:var(--rxl);padding:36px;color:#fff;box-shadow:var(--sl);margin-bottom:1.5rem;position:relative;overflow:hidden}
.recommend-card::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 100% 0%,rgba(96,165,250,.15),transparent 60%)}
.recommend-label{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#60a5fa;margin-bottom:.5rem;position:relative}
.recommend-card h3{font-family:var(--f);font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:.8rem;position:relative}
.recommend-card p{font-size:.92rem;color:rgba(255,255,255,.7);line-height:1.65;margin-bottom:1.4rem;position:relative}
.recommend-btns{display:flex;gap:10px;flex-wrap:wrap;position:relative}
.btn-white-rec{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--navy);padding:12px 24px;border-radius:980px;font-size:.9rem;font-weight:700;text-decoration:none;border:none;cursor:pointer;font-family:var(--f)}
.btn-outline-white{display:inline-flex;align-items:center;gap:6px;background:transparent;color:rgba(255,255,255,.9);border:1.5px solid rgba(255,255,255,.3);padding:11px 22px;border-radius:980px;font-size:.9rem;font-weight:600;text-decoration:none;font-family:var(--f);cursor:pointer}
.review-card{background:#fff;border:1px solid var(--bd);border-radius:var(--rlg);padding:28px;box-shadow:var(--ss);margin-bottom:1.5rem}
.review-card h3{font-family:var(--f);font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:.3rem}
.review-card .review-sub{font-size:.82rem;color:var(--tm);margin-bottom:1.2rem}

.review-list{display:flex;flex-direction:column;gap:14px}
.review-item{border:1px solid var(--bd);border-radius:var(--r);padding:18px;background:var(--bg2)}

.review-item.incorrect{border-left:4px solid var(--red)}
.review-item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:.8rem}
.review-item-num{font-size:.74rem;font-weight:700;color:var(--tl);letter-spacing:.08em;text-transform:uppercase;font-family:var(--f)}
.review-item-status{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
.review-item-status.correct{background:#dcfce7;color:#15803d}
.review-item-status.incorrect{background:#fee2e2;color:#991b1b}
.review-q-text{font-size:.88rem;color:var(--t);font-weight:500;margin-bottom:.8rem;line-height:1.5}
.review-q-passage{background:#fff;border-left:3px solid var(--blue);padding:10px 14px;border-radius:0 var(--rsm) var(--rsm) 0;font-size:.8rem;color:var(--t2);line-height:1.55;margin-bottom:.7rem;font-style:italic}

.review-ans.your{background:#fee2e2;border-color:#fca5a5;color:#991b1b}

.review-ans-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
